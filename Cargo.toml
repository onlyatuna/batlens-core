[package]
name = "batlens-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Evan Chen <evanchen940628@gmail.com>"]
description = "Battery data library for batlens (Windows)"
license = "MIT"

[dependencies]
chrono = "0.4.45"
quick-xml = "0.37.5"
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
